<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | Doctor Na Gola</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar"></nav>

  <header class="page-header fade-in">
    <div class="container" style="max-width: 600px;">
      <h1>Track Your Orders</h1>
      <p>See the live status of your orders. Enter an Order ID to find a specific one.</p>
    </div>
  </header>

  <main class="section" style="padding-top: 0; min-height: 50vh;">
    <div class="container" style="max-width: 600px;">
      
      <div class="trk-search fade-in">
        <label for="trackInput">Find by Order ID</label>
        <div class="trk-search-box">
          <svg class="trk-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="trackInput" placeholder="e.g. 12" onkeyup="if(event.key==='Enter') searchOrder()">
          <button class="btn btn-primary" onclick="searchOrder()">Search</button>
        </div>
      </div>

      <div id="trackResult" style="margin-top: 2rem; display: none;" class="fade-in">
        <!-- Results will be injected here -->
      </div>
      
      <div id="trackLoader" style="display: none; text-align: center; margin-top: 2rem;">
        <p>Loading...</p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
